name: Build & Test - libtorrent v2 migration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (JVM Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # assembleDebug y no build: `build` arrastra lintDebug, y el modulo :tv
      # tiene errores de lint preexistentes de media3 (UnsafeOptInUsageError en
      # AudioAwareRenderersFactory). Se compila y se testea aca; el lint corre
      # aparte y sin bloquear, para que no tape un fallo de compilacion real.
      - name: Build :core module (Android + JVM tests)
        run: ./gradlew :core:assembleDebug :core:test --no-daemon --stacktrace

      - name: Build :data module
        run: ./gradlew :data:assembleDebug --no-daemon

      - name: Build :tv module
        run: ./gradlew :tv:assembleDebug --no-daemon

      - name: Lint (informativo, no bloquea)
        if: always()
        continue-on-error: true
        run: ./gradlew :tv:lintDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/test-results/**"