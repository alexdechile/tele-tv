name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug TV module
        run: ./gradlew :tv:assembleDebug :core:test --no-daemon

      # Falla el build si el binario nativo de libtorrent no quedó empaquetado:
      # compilaría igual, pero la app reventaría en la TV con UnsatisfiedLinkError.
      # Guarda contra "los tests no corrieron" (Gradle puede saltearlos en silencio).
      - name: Verificar que los tests se ejecutaron
        run: |
          python3 - <<'PYEOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          total = failures = errors = skipped = 0
          files = glob.glob("core/build/test-results/**/TEST-*.xml", recursive=True)
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))

          print(f"archivos={len(files)} tests={total} failures={failures} errors={errors} skipped={skipped}")
          if total == 0:
              print("::error::No se ejecuto ningun test")
              sys.exit(1)
          if failures or errors:
              print("::error::Hay tests fallidos")
              sys.exit(1)
          PYEOF

      - name: Verificar libtorrent4j.so en el APK
        run: |
          APK=$(ls tv/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'lib/' | head -20
          for ABI in arm64-v8a x86_64; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libtorrent4j.so"; then
              echo "OK: lib/$ABI/libtorrent4j.so"
            else
              echo "::error::Falta lib/$ABI/libtorrent4j.so en el APK"
              exit 1
            fi
          done

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tele-tv-debug
          path: tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Arranca la app de verdad en un emulador y falla si se cierra al abrir.
  # Esto es lo que faltaba: "compila" no era lo mismo que "abre".
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: tele-tv-debug
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Arrancar app en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/smoke-test.sh apk/tv-debug.apk 25

      - name: Guardar logcat
        if: always()
        run: |
          adb logcat -d > logcat-completo.txt || true
          adb logcat -d -b crash > logcat-crash.txt || true
          wc -l logcat-completo.txt logcat-crash.txt || true

      - name: Publicar logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            logcat-completo.txt
            logcat-crash.txt
          if-no-files-found: warn
          retention-days: 7
